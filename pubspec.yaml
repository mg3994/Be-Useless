name: app
description: A universal Schema.org Dart library integrating JSON Schema, JSON-LD, Schemantic, and Google Genkit.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  schemantic: any

dev_dependencies:
  build_runner: any
  freezed: any
  http: ^1.2.0
  json_serializable: ^6.14.1
  lints: any
  schemantic_builder: any
  test: any

dependency_overrides:
  source_helper: 1.3.12
